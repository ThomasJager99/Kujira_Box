# code-server — VS Code in the browser
# Copy this file to docker-compose.yml and the env file to .env, then adjust.
#
# Single container, so the frontend/backend network split isn't needed here —
# pinning + optional hardening apply.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

services:
  code-server:
    <<: *service-defaults
    image: ${CODE_SERVER_IMAGE:-codercom/code-server}:${CODE_SERVER_VERSION:-4.143.1}
    container_name: code-server
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Etc/UTC}
      # Web login password (required). Generate: openssl rand -hex 16
      PASSWORD: ${CODE_SERVER_PASSWORD:?set CODE_SERVER_PASSWORD in .env}
    volumes:
      - code_server_config:/home/coder/.config   # settings, installed extensions
      - ${PROJECTS_PATH:-./projects}:/home/coder/project   # your code lives here
    healthcheck:
      # Debian-based image ships curl; /healthz returns 200 when ready.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: ${CODE_SERVER_MEM_LIMIT:-2g}
    mem_reservation: ${CODE_SERVER_MEM_RESERVATION:-256m}
    cpus: ${CODE_SERVER_CPUS:-2.0}
    # --- Optional hardening (test first; a dev container often needs write access) ---
    # cap_drop:
    #   - ALL
    # read_only: true
    # tmpfs:
    #   - /tmp

volumes:
  code_server_config:
