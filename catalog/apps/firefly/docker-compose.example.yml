# Firefly III — self-hosted personal finance manager
# https://www.firefly-iii.org  |  https://github.com/firefly-iii/firefly-iii
#
# Rename this file to docker-compose.yml, copy .env.example to .env,
# fill in the values, then:  docker compose up -d
#
# Architecture (why 3 containers, not 1):
#   app   -> the Firefly III web app itself (stateless; can be recreated/upgraded freely)
#   db    -> MariaDB; ALL your data lives here, in a named volume that survives restarts
#   cron  -> tiny Alpine box that pings Firefly once a day to run scheduled jobs
#            (recurring transactions, bill reminders, etc.)

services:
  app:
    image: fireflyiii/core:latest
    container_name: firefly_iii_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    ports:
      # host:container — change the host port in .env if 8080 is taken.
      # In production put a reverse proxy (Caddy/Traefik/nginx) in front for HTTPS.
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${APP_MEM_LIMIT:-512m}
    mem_reservation: 256m

  db:
    image: mariadb:lts
    container_name: firefly_iii_db
    restart: unless-stopped
    environment:
      # Root password is randomised and never needed from outside.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      # These MUST match the DB_* values in your .env file.
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - firefly_db:/var/lib/mysql
    healthcheck:
      # Ships with the mariadb image; passes once InnoDB is up and accepting connections.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: ${DB_MEM_LIMIT:-512m}
    mem_reservation: 256m

  cron:
    image: alpine:latest
    container_name: firefly_iii_cron
    restart: unless-stopped
    environment:
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN}
    # Registers a daily 03:00 job that hits Firefly's cron endpoint, then runs crond
    # in the foreground. The $$ is an escaped $ so Compose passes it through to the shell.
    command: >
      sh -c "echo \"0 3 * * * wget -qO- http://app:8080/api/v1/cron/$${STATIC_CRON_TOKEN}\"
      | crontab - && crond -f -L /dev/stdout"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    mem_reservation: 16m

volumes:
  firefly_upload:
  firefly_db:
