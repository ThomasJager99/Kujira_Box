# IT-Tools — a collection of handy developer / IT utilities in the browser
# https://github.com/CorentinTh/it-tools  (image: ghcr.io/corentinth/it-tools)
#
# Single, stateless container. Copy .env.example to .env, then: docker compose up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

services:
  it-tools:
    <<: *service-defaults
    image: ${ITTOOLS_IMAGE}
    container_name: it-tools
    ports:
      - "${ITTOOLS_PORT:-8080}:80"     # container serves the static site on 80
    mem_limit: ${ITTOOLS_MEM_LIMIT:-128m}
    mem_reservation: 32m
    cpus: 0.5
    healthcheck:
      # nginx-based image → busybox wget is present.
      <<: *default-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      start_period: 10s
