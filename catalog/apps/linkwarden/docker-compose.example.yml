# Linkwarden — self-hosted bookmark manager with page archiving
# https://github.com/linkwarden/linkwarden
#
# Three-container stack: app + PostgreSQL + Meilisearch (full-text search).
# Copy .env.example to .env, then: docker compose up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 5

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

services:
  linkwarden:
    <<: *service-defaults
    image: ${LINKWARDEN_IMAGE}
    container_name: linkwarden
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - linkwarden_data:/data/data          # uploaded files + page archives
    ports:
      - "${LINKWARDEN_PORT:-3000}:3000"
    mem_limit: ${LINKWARDEN_MEM_LIMIT:-1g}
    mem_reservation: 256m
    cpus: 2.0
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      start_period: 60s

  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE}
    container_name: linkwarden_db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - linkwarden_pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      start_period: 30s

  meilisearch:
    <<: *service-defaults
    image: ${MEILI_IMAGE}
    container_name: linkwarden_meili
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - linkwarden_meili:/meili_data
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0

volumes:
  linkwarden_data:
  linkwarden_pgdata:
  linkwarden_meili:
