# Mealie — self-hosted recipe manager & meal planner
# https://github.com/mealie-recipes/mealie
#
# Two-container stack: Mealie + PostgreSQL.
# Copy .env.example to .env, then: docker compose up -d
# Tip: pin MEALIE_IMAGE to a specific version tag for production.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 5

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

services:
  mealie:
    <<: *service-defaults
    image: ${MEALIE_IMAGE}
    container_name: mealie
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      BASE_URL: ${BASE_URL}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      DB_ENGINE: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mealie_data:/app/data        # recipes, images, backups
    ports:
      - "${MEALIE_PORT:-9925}:9000"  # container listens on 9000
    mem_limit: ${MEALIE_MEM_LIMIT:-1g}
    mem_reservation: 256m
    cpus: 2.0
    healthcheck:
      # Mealie's image has Python (it's a FastAPI app) but not necessarily curl —
      # use Python to hit its public /api/app/about endpoint.
      <<: *default-healthcheck
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/api/app/about')\" || exit 1"]
      start_period: 45s

  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE}
    container_name: mealie_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mealie_pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 30s

volumes:
  mealie_data:
  mealie_pgdata:
