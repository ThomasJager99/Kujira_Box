# Portainer CE — web UI for managing Docker
# https://github.com/portainer/portainer  (image: portainer/portainer-ce)
#
# Single container. Copy .env.example to .env, then: docker compose up -d
#
# SECURITY: Portainer mounts the Docker socket, so it can create, stop and
# inspect ANY container — that is effectively root on the host. Only run it on
# trusted hosts and never expose it to the open internet without protection.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

services:
  portainer:
    <<: *service-defaults
    image: ${PORTAINER_IMAGE}
    container_name: portainer
    volumes:
      # Full Docker daemon control (read-write socket) — the security note above.
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "${PORTAINER_PORT:-9443}:9443"     # HTTPS web UI (self-signed cert)
      # - "8000:8000"                       # optional: Edge agent tunnel
    mem_limit: ${PORTAINER_MEM_LIMIT:-256m}
    mem_reservation: 64m
    cpus: 1.0
    # No healthcheck: Portainer's image is minimal (no shell / HTTP client to run
    # an in-container check) and the UI is HTTPS with a self-signed cert — so we
    # rely on `restart: unless-stopped` instead of faking a broken healthcheck.

volumes:
  portainer_data:
