# Stirling-PDF — self-hosted web toolkit for PDF operations
# https://github.com/Stirling-Tools/Stirling-PDF
#
# Single container. Copy .env.example to .env, then: docker compose up -d
#
# Image variants: ':latest' (standard), ':latest-fat' (adds LibreOffice + OCR
# for conversions and OCR), ':latest-ultra-lite' (minimal, fewer tools).

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 5

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

services:
  stirling-pdf:
    <<: *service-defaults
    image: ${STIRLING_IMAGE}
    container_name: stirling-pdf
    environment:
      # Login is off by default — set true (and configure) to require accounts.
      SECURITY_ENABLELOGIN: ${SECURITY_ENABLELOGIN:-false}
      SYSTEM_DEFAULTLOCALE: ${SYSTEM_DEFAULTLOCALE:-en-GB}
    volumes:
      - stirling_configs:/configs              # settings + app database
      - stirling_tessdata:/usr/share/tessdata  # OCR language files
      - stirling_logs:/logs
      - stirling_pipeline:/pipeline            # automation pipelines
    ports:
      - "${STIRLING_PORT:-8080}:8080"
    mem_limit: ${STIRLING_MEM_LIMIT:-2g}
    mem_reservation: 512m
    cpus: 2.0
    healthcheck:
      # Spring Boot app — boots slowly; hit its status endpoint (image ships curl).
      <<: *default-healthcheck
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/api/v1/info/status || exit 1"]
      start_period: 60s

volumes:
  stirling_configs:
  stirling_tessdata:
  stirling_logs:
  stirling_pipeline:
