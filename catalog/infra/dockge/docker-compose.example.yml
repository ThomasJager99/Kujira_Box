# Dockge — self-hosted Docker Compose stack manager
# https://github.com/louislam/dockge  (image: louislam/dockge)
#
# Single container. Copy .env.example to .env, then: docker compose up -d
#
# SECURITY: this container mounts the Docker socket, so it can control the
# whole Docker daemon — effectively root on the host. Only run it on hosts
# you trust and don't expose it to the open internet without protection.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

services:
  dockge:
    <<: *service-defaults
    image: ${DOCKGE_IMAGE}
    container_name: dockge
    ports:
      - "${DOCKGE_PORT:-5001}:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockge_data:/app/data
      # The stacks dir must be the SAME path inside and outside the container.
      - ${DOCKGE_STACKS_DIR:-/opt/stacks}:${DOCKGE_STACKS_DIR:-/opt/stacks}
    environment:
      DOCKGE_STACKS_DIR: ${DOCKGE_STACKS_DIR:-/opt/stacks}
    mem_limit: ${DOCKGE_MEM_LIMIT:-256m}
    mem_reservation: 64m
    cpus: 0.5
    healthcheck:
      # Dockge ships no curl/wget, but it's a Node app, so Node is always
      # present — use it as the HTTP client for the check.
      <<: *default-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 30s

volumes:
  dockge_data:
