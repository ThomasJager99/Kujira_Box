# Infisical — self-hosted secrets management for developers & apps. Store API
# keys, DB passwords, env vars and certs centrally; inject them into apps/CI via
# CLI, SDKs, or Kubernetes/agent integrations — instead of scattering secrets in
# .env files. (Different from Vaultwarden, which is a personal password manager;
# Infisical is for application/infrastructure secrets.)
#
# Three services: Infisical + PostgreSQL (data) + Redis (cache/queues). Both
# datastores sit on an internal, no-egress network.
#
# Copy to docker-compose.yml, copy .env.example to .env, fill the secrets, then:
#   docker compose up -d
#
# Meta note: the ENCRYPTION_KEY / AUTH_SECRET / DB password below are exactly
# the kind of secrets hardening entry 14 is about graduating out of plaintext.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

services:
  infisical:
    <<: *service-defaults
    image: infisical/infisical:${INFISICAL_VERSION:-v0.167.14}
    container_name: infisical
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Public URL the app is reached on.
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      # Root encryption key — 16-byte hex:  openssl rand -hex 16
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?generate with: openssl rand -hex 16}
      # Auth/JWT signing secret — base64:   openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:?generate with: openssl rand -base64 32}
      DB_CONNECTION_URI: "postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "${LISTEN_ADDR:-0.0.0.0}:${INFISICAL_PORT:-8080}:8080"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/status || exit 1"]
    mem_limit: ${INFISICAL_MEM_LIMIT:-1g}
    mem_reservation: 256m
    cpus: ${INFISICAL_CPUS:-1.0}
    pids_limit: ${INFISICAL_PIDS_LIMIT:-300}
    networks: [frontend, backend]

  db:
    <<: *service-defaults
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: infisical-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - infisical-db:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    mem_reservation: 128m
    cpus: ${POSTGRES_CPUS:-1.0}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-200}
    networks: [backend]

  redis:
    <<: *service-defaults
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: infisical-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    mem_reservation: 64m
    cpus: ${REDIS_CPUS:-0.5}
    pids_limit: ${REDIS_PIDS_LIMIT:-100}
    networks: [backend]

networks:
  frontend:
  backend:
    internal: true          # DB + Redis reachable only inside the stack — no egress

volumes:
  infisical-db:
