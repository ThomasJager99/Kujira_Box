# Nginx Proxy Manager — reverse proxy with a web UI + Let's Encrypt
# Copy this file to docker-compose.yml and the env file to .env, then adjust.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

services:
  npm:
    <<: *service-defaults
    image: ${NPM_IMAGE:-jc21/nginx-proxy-manager}:${NPM_VERSION:-latest}
    container_name: nginx-proxy-manager
    ports:
      - "${NPM_HTTP_PORT:-80}:80"      # public HTTP  (proxied sites + ACME challenges)
      - "${NPM_HTTPS_PORT:-443}:443"   # public HTTPS (proxied sites)
      - "${NPM_ADMIN_PORT:-81}:81"     # admin web UI — keep this off the public internet
    environment:
      TZ: ${TZ:-Etc/UTC}
      # Uses an embedded SQLite database by default (stored in /data).
      # To use an external DB instead, set DB_MYSQL_* and add a db service.
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    healthcheck:
      <<: *healthcheck-defaults
      # The image bundles a /bin/check-health script; this curl to the admin
      # port is an explicit equivalent that also proves the UI is serving.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:81"]
    mem_limit: ${NPM_MEM_LIMIT:-512m}
    mem_reservation: ${NPM_MEM_RESERVATION:-128m}
    cpus: ${NPM_CPUS:-1.0}

volumes:
  npm_data:
  npm_letsencrypt:
