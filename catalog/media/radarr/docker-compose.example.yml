# Radarr — movie collection manager for the *arr stack
# Copy this file to docker-compose.yml and the env file to .env, then adjust.
#
# Single container, so the frontend/backend network split isn't needed here —
# pinning + optional hardening apply.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

services:
  radarr:
    <<: *service-defaults
    image: ${RADARR_IMAGE:-lscr.io/linuxserver/radarr}:${RADARR_VERSION:-latest}
    container_name: radarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${RADARR_PORT:-7878}:7878"
    volumes:
      - radarr_config:/config          # app db + settings
      - ${MOVIES_PATH:-./movies}:/movies           # your movie library
      - ${DOWNLOADS_PATH:-./downloads}:/downloads   # your download client's folder
    healthcheck:
      # LinuxServer (Alpine) image ships busybox wget; /ping returns 200 when up.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: ${RADARR_MEM_LIMIT:-1g}
    mem_reservation: ${RADARR_MEM_RESERVATION:-128m}
    cpus: ${RADARR_CPUS:-1.0}
    # --- Optional hardening (test first; LSIO images can need a writable rootfs) ---
    # cap_drop:
    #   - ALL
    # read_only: true
    # tmpfs:
    #   - /tmp

volumes:
  radarr_config:
