# Sonarr — TV series collection manager for the *arr stack
# Copy this file to docker-compose.yml and the env file to .env, then adjust.
#
# Single container, so the frontend/backend network split isn't needed here —
# pinning + optional hardening apply.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

services:
  sonarr:
    <<: *service-defaults
    image: ${SONARR_IMAGE:-lscr.io/linuxserver/sonarr}:${SONARR_VERSION:-latest}
    container_name: sonarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${SONARR_PORT:-8989}:8989"
    volumes:
      - sonarr_config:/config          # app db + settings
      - ${TV_PATH:-./tv}:/tv           # your TV library (where files land)
      - ${DOWNLOADS_PATH:-./downloads}:/downloads  # your download client's folder
    healthcheck:
      # LinuxServer (Alpine) image ships busybox wget; /ping returns 200 when up.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: ${SONARR_MEM_LIMIT:-1g}
    mem_reservation: ${SONARR_MEM_RESERVATION:-128m}
    cpus: ${SONARR_CPUS:-1.0}
    # --- Optional hardening (test first; LSIO images can need a writable rootfs) ---
    # cap_drop:
    #   - ALL
    # read_only: true
    # tmpfs:
    #   - /tmp

volumes:
  sonarr_config:
