# Dozzle — real-time Docker log viewer in the browser
# Copy this file to docker-compose.yml and the env file to .env, then adjust.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

services:
  dozzle:
    <<: *service-defaults
    image: ${DOZZLE_IMAGE:-amir20/dozzle}:${DOZZLE_VERSION:-latest}
    container_name: dozzle
    ports:
      - "${DOZZLE_PORT:-8080}:8080"
    environment:
      DOZZLE_LEVEL: ${DOZZLE_LEVEL:-info}
      # Optional built-in login (simple auth). Leave empty for no auth on a
      # trusted LAN; set a provider + users file to protect it.
      DOZZLE_AUTH_PROVIDER: ${DOZZLE_AUTH_PROVIDER:-none}
    volumes:
      # Read-only socket: Dozzle only needs to READ logs, never control Docker.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      <<: *healthcheck-defaults
      # Distroless image (no shell/wget) — use the binary's own subcommand.
      test: ["CMD", "/dozzle", "healthcheck"]
    mem_limit: ${DOZZLE_MEM_LIMIT:-256m}
    mem_reservation: ${DOZZLE_MEM_RESERVATION:-64m}
    cpus: ${DOZZLE_CPUS:-0.5}
