# Umami — privacy-friendly, self-hosted web analytics
# Copy this file to docker-compose.yml and the env file to .env, then adjust.
#
# Upgraded house-style template: pinned versions, frontend/backend network split
# (DB isolated), optional hardening block, secrets in .env.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

services:
  umami:
    <<: *service-defaults
    image: ${UMAMI_IMAGE:-ghcr.io/umami-software/umami}:${UMAMI_VERSION:-postgresql-v3.4.1}
    container_name: umami
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${UMAMI_PORT:-3000}:3000"
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-umami}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-umami}
      # Secret used to sign auth tokens. Generate: openssl rand -hex 32
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env}
    networks:
      - frontend
      - backend
    healthcheck:
      <<: *healthcheck-defaults
      # Node/Alpine image ships busybox wget; /api/heartbeat returns 200 when up.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/heartbeat"]
    mem_limit: ${UMAMI_MEM_LIMIT:-512m}
    mem_reservation: ${UMAMI_MEM_RESERVATION:-128m}
    cpus: ${UMAMI_CPUS:-1.0}
    # --- Optional hardening (test first) ---
    # cap_drop:
    #   - ALL
    # read_only: true
    # tmpfs:
    #   - /tmp

  db:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-postgres}:${POSTGRES_VERSION:-16-alpine}
    container_name: umami_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umami}
      POSTGRES_USER: ${POSTGRES_USER:-umami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend          # isolated: no internet, unreachable outside the stack
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umami} -d ${POSTGRES_DB:-umami}"]
      start_period: 20s
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    mem_reservation: ${POSTGRES_MEM_RESERVATION:-128m}
    cpus: ${POSTGRES_CPUS:-1.0}

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
